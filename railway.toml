# Railway config-as-code for iag-api-gateway (repo root = service root).
# https://docs.railway.com/config-as-code/reference
#
# This file records what the service already does; it is not a change of
# behaviour. The Dockerfile's final stage is the runtime image, which is what
# Railway builds by default, and /ready already answers 200 in production.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# The gateway serves /ready itself. With READY_PROBE_UPSTREAMS=false (the
# default) it reports on the gateway alone, so a single unhealthy upstream
# cannot fail the gateway's own deploy — which is what you want from the one
# public entry point.
healthcheckPath = "/ready"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# Replica count lives here rather than in the dashboard, so the topology is
# reviewable and survives someone clicking in a hurry.
#
# Held at 1, and this is the service where that matters most. The rate limiter
# keeps its counters in this process unless REDIS_URL is set, so a second
# replica does not share the budget — it adds a whole second one. Scaling the
# gateway out before Redis exists would quietly double the ceiling that
# protects every service behind it.
#
# Raise to 2 only once REDIS_URL is set, and confirm the boot log says
# "rate limiting is Redis-backed" rather than warning about in-memory counters.
numReplicas = 1
